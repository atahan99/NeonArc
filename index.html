<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<title>NeonArc · terminal arcade in the browser</title>
<meta name="description" content="Eight classic games and five retro Unix toys, played from a command prompt in your browser. One HTML file, no dependencies." />
<meta name="theme-color" content="#07030f" />
<link rel="canonical" href="https://neonarc.cybrsmr.xyz/" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://neonarc.cybrsmr.xyz/" />
<meta property="og:title" content="NeonArc" />
<meta property="og:description" content="Eight classic games and five retro Unix toys, played from a command prompt in your browser." />
<meta property="og:image" content="https://neonarc.cybrsmr.xyz/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="The NeonArc main menu: a terminal listing Snake, Tetris, Sudoku and other games." />
<meta name="twitter:card" content="summary_large_image" />
<style>
  /* ============================================================
     NEONARC - cyberpunk neon terminal arcade
     Theme: dark purple/black bg, neon cyan/magenta/purple/green
     ============================================================ */
  :root {
    --bg: #07030f;
    --bg2: #0d0620;
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --purple: #a45bff;
    --green: #3dff9a;
    --amber: #ffd166;
    --red: #ff5470;
    --text: #b9ffd8;
    --dim: #6a7f8f;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      radial-gradient(1200px 700px at 70% -10%, rgba(164,91,255,0.18), transparent 60%),
      radial-gradient(900px 600px at 0% 110%, rgba(0,240,255,0.12), transparent 55%),
      var(--bg);
    color: var(--green);
    font-family: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", "Liberation Mono", monospace;
    font-size: 15px;
    line-height: 1.35;
    overflow: hidden;
  }

  /* CRT flicker over the whole app */
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 10px;
    animation: crtFlicker 6s infinite steps(60);
  }

  @keyframes crtFlicker {
    0%, 100% { opacity: 1; }
    47% { opacity: 0.99; }
    48% { opacity: 0.93; }
    49% { opacity: 1; }
    92% { opacity: 0.97; }
    93% { opacity: 1; }
  }

  /* Scanline overlay */
  .scanlines {
    pointer-events: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.16) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode: overlay;
  }
  .scanlines::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 120% at 50% 50%, transparent 60%, rgba(0,0,0,0.5) 100%);
  }

  header.topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border: 1px solid var(--cyan);
    border-radius: 8px;
    padding: 8px 14px;
    background: linear-gradient(180deg, rgba(0,240,255,0.06), rgba(0,0,0,0));
    box-shadow: 0 0 12px rgba(0,240,255,0.25), inset 0 0 18px rgba(0,240,255,0.06);
  }
  header.topbar .brand {
    font-weight: 700;
    letter-spacing: 6px;
    font-size: 22px;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan), 0 0 20px rgba(0,240,255,0.6);
  }
  header.topbar .topright {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header.topbar .tag {
    color: var(--magenta);
    letter-spacing: 2px;
    font-size: 12px;
    text-shadow: 0 0 8px rgba(255,43,214,0.7);
  }
  header.topbar .ghlink {
    display: inline-flex;
    align-items: center;
    color: var(--cyan);
    filter: drop-shadow(0 0 6px rgba(0,240,255,0.5));
    transition: color 0.15s ease, filter 0.15s ease, transform 0.15s ease;
  }
  header.topbar .ghlink:hover {
    color: #fff;
    filter: drop-shadow(0 0 10px rgba(0,240,255,0.9));
    transform: translateY(-1px);
  }

  main {
    flex: 1;
    display: flex;
    gap: 10px;
    min-height: 0;
  }

  /* Terminal output */
  #terminal {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    border: 1px solid var(--magenta);
    border-radius: 8px;
    padding: 12px 14px;
    background: linear-gradient(180deg, rgba(255,43,214,0.05), rgba(0,0,0,0.2));
    box-shadow: 0 0 12px rgba(255,43,214,0.18), inset 0 0 22px rgba(0,0,0,0.5);
    white-space: pre-wrap;
    word-break: break-word;
  }
  #terminal .line { text-shadow: 0 0 6px rgba(61,255,154,0.45); }
  .c { color: var(--cyan); text-shadow: 0 0 8px rgba(0,240,255,0.6); }
  .m { color: var(--magenta); text-shadow: 0 0 8px rgba(255,43,214,0.6); }
  .p { color: var(--purple); text-shadow: 0 0 8px rgba(164,91,255,0.6); }
  .g { color: var(--green); }
  .y { color: var(--amber); text-shadow: 0 0 8px rgba(255,209,102,0.6); }
  .r { color: var(--red); text-shadow: 0 0 8px rgba(255,84,112,0.6); }
  .dim { color: var(--dim); text-shadow: none; }
  .echo { color: var(--purple); }

  /* Game viewport */
  #viewport {
    flex: 1;
    min-width: 0;
    display: none;
    touch-action: none; /* swipes and taps go to the game, not page scroll/zoom */
    border: 1px solid var(--purple);
    border-radius: 8px;
    padding: 10px 12px;
    background: linear-gradient(180deg, rgba(164,91,255,0.06), rgba(0,0,0,0.25));
    box-shadow: 0 0 14px rgba(164,91,255,0.25), inset 0 0 22px rgba(0,0,0,0.5);
    overflow: auto;
  }
  #app.game #terminal { flex: 0 0 clamp(220px, 28%, 380px); }
  #app.game #viewport {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Draggable splitter between terminal and viewport */
  .splitter {
    display: none;
    flex: 0 0 8px;
    align-self: stretch;
    cursor: col-resize;
    border-radius: 6px;
    background: linear-gradient(180deg, rgba(0,240,255,0.3), rgba(255,43,214,0.3));
    box-shadow: 0 0 8px rgba(0,240,255,0.3);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  #app.game .splitter { display: block; }
  .splitter:hover,
  .splitter.dragging {
    background: linear-gradient(180deg, rgba(0,240,255,0.7), rgba(255,43,214,0.7));
    box-shadow: 0 0 14px rgba(0,240,255,0.6);
  }
  #screen {
    margin: 0;
    white-space: pre;
    font-family: inherit;
    color: var(--green);
    text-shadow: 0 0 8px rgba(61,255,154,0.5);
    font-size: 16px; /* fitScreen() sizes it to the board */
    line-height: 1.2;
  }
  #screen .hi { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }

  /* Clickable menu entries */
  .link { cursor: pointer; }
  .link:hover, .link:focus { text-decoration: underline; outline: none; }

  /* Touch controls (shown on small or touch screens while a game runs) */
  #touch { display: none; flex-wrap: wrap; gap: 6px; justify-content: center; }
  #touch button {
    flex: 1 0 auto;
    min-width: max(44px, 17%); /* digit pads wrap five to a row */
    min-height: 44px;
    padding: 6px 4px;
    font: inherit;
    color: var(--cyan);
    background: rgba(0,240,255,0.06);
    border: 1px solid rgba(0,240,255,0.5);
    border-radius: 6px;
    touch-action: manipulation;
  }
  #touch button:active { background: rgba(0,240,255,0.2); }
  #touch .logbtn { display: none; }

  /* Input row */
  .inputrow {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--cyan);
    border-radius: 8px;
    padding: 8px 12px;
    background: rgba(0,240,255,0.04);
    box-shadow: 0 0 10px rgba(0,240,255,0.18);
  }
  .prompt { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); font-weight: 700; }
  #cmd {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    font-family: inherit;
    font-size: 15px;
    text-shadow: 0 0 6px rgba(61,255,154,0.5);
    caret-color: var(--green);
  }
  .cursor {
    width: 10px;
    height: 18px;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .inputrow:focus-within .cursor { display: none; }

  /* Status bar */
  .status {
    border: 1px solid var(--green);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12.5px;
    letter-spacing: 1px;
    color: var(--green);
    background: rgba(61,255,154,0.05);
    box-shadow: 0 0 10px rgba(61,255,154,0.15);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status b { color: var(--cyan); }

  /* Scrollbars */
  #terminal::-webkit-scrollbar,
  #viewport::-webkit-scrollbar { width: 8px; }
  #terminal::-webkit-scrollbar-thumb,
  #viewport::-webkit-scrollbar-thumb {
    background: rgba(0,240,255,0.4);
    border-radius: 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    #app, .cursor { animation: none; }
    header.topbar .ghlink, .splitter { transition: none; }
  }

  @media (max-width: 720px), (pointer: coarse) {
    #app.game #touch { display: flex; }
  }

  @media (max-width: 720px) {
    #app { padding: 10px; gap: 8px; }
    main { flex-direction: column; gap: 8px; }
    .splitter { display: none !important; }
    header.topbar .tag { display: none; }
    /* board first, a 2-line log under it (tap "log" to expand), then the touch controls */
    #app.game #viewport { order: 1; padding: 6px; }
    #app.game #terminal { order: 2; flex: 0 0 auto !important; max-height: calc(2.7em + 18px); padding: 8px 10px; }
    #app.game.logopen #terminal { max-height: 45%; }
    #touch .logbtn { display: block; }
  }
</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <span class="brand">NEONARC</span>
      <div class="topright">
        <span class="tag">// CYBERDECK TERMINAL ARCADE</span>
        <a class="ghlink" href="https://github.com/atahan99/NeonArc" target="_blank"
           rel="noopener noreferrer" aria-label="View source on GitHub" title="View on GitHub">
          <svg viewBox="0 0 16 16" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
          </svg>
        </a>
      </div>
    </header>

    <main>
      <div id="terminal" aria-live="polite"></div>
      <div id="splitter" class="splitter" title="Drag to resize"></div>
      <div id="viewport"><pre id="screen"></pre></div>
    </main>

    <div id="touch"></div>

    <div class="inputrow">
      <span class="prompt">&gt;</span>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" aria-label="terminal command input" />
      <span class="cursor"></span>
    </div>

    <div id="status" class="status"></div>
  </div>
  <div class="scanlines"></div>

<script>
/* ============================================================
   NEONARC
   - shell: boot, output, command parsing, mode switching, status
   - GAMES: registry of self-contained mini-games
   ============================================================ */
(function () {
  "use strict";

  // ---------- DOM ----------
  var terminalEl = document.getElementById("terminal");
  var viewportEl = document.getElementById("viewport");
  var screenEl = document.getElementById("screen");
  var inputEl = document.getElementById("cmd");
  var statusEl = document.getElementById("status");
  var splitterEl = document.getElementById("splitter");
  var mainEl = document.querySelector("main");
  var appEl = document.getElementById("app");
  var touchEl = document.getElementById("touch");

  // ---------- helpers ----------
  function print(text, cls) {
    var lines = String(text).split("\n");
    for (var i = 0; i < lines.length; i++) {
      var div = document.createElement("div");
      div.className = "line" + (cls ? " " + cls : "");
      div.textContent = lines[i].length ? lines[i] : "\u200b";
      terminalEl.appendChild(div);
    }
    terminalEl.scrollTop = terminalEl.scrollHeight;
    return div;
  }
  function clearTerminal() { terminalEl.innerHTML = ""; }
  function setScreen(html) { screenEl.innerHTML = html; fitScreen(); }

  // Size the board font so the text grid fills the viewport. Rows/cols only grow during a
  // round (cleared on launch), so the board doesn't jump when e.g. a GAME OVER line appears.
  var CHAR_W = 0, LINE_H = 1.2, fitCols = 0, fitRows = 0;
  function fitScreen() {
    if (!appEl.classList.contains("game")) return;
    if (!CHAR_W) {
      var probe = document.createElement("span");
      probe.style.fontSize = "100px";
      probe.textContent = "0000000000";
      screenEl.appendChild(probe);
      CHAR_W = probe.getBoundingClientRect().width / 1000 || 0.6;
      screenEl.removeChild(probe);
    }
    var lines = screenEl.textContent.replace(/\n$/, "").split("\n");
    fitRows = Math.max(fitRows, lines.length);
    for (var i = 0; i < lines.length; i++) fitCols = Math.max(fitCols, lines[i].length);
    var cs = getComputedStyle(viewportEl);
    var w = viewportEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var h = viewportEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var px = Math.floor(Math.min(w / (fitCols * CHAR_W), h / (fitRows * LINE_H)) * 10) / 10;
    px = Math.max(8, Math.min(48, px)) + "px";
    if (screenEl.style.fontSize !== px) screenEl.style.fontSize = px;
  }
  window.addEventListener("resize", fitScreen);
  function escHTML(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function center(s, w) {
    s = String(s);
    if (s.length >= w) return s;
    var total = w - s.length;
    var left = Math.floor(total / 2);
    return " ".repeat(left) + s + " ".repeat(total - left);
  }
  function load(key, def) {
    try { var v = localStorage.getItem(key), n = Number(v); return v === null || !isFinite(n) ? def : n; }
    catch (e) { return def; }
  }
  function save(key, val) { try { localStorage.setItem(key, String(val)); } catch (e) {} }
  function neonSpan(ch, col, glow) {
    glow = glow === undefined ? 6 : glow;
    return '<span style="color:' + col + ';text-shadow:0 0 ' + glow + 'px ' + col + '">' + ch + "</span>";
  }
  function moveCursor(e, pos, w, h, cb) {
    var k = e.key.toLowerCase();
    if (e.key === "ArrowUp" || k === "w") { pos.r = (pos.r + h - 1) % h; cb(); return true; }
    if (e.key === "ArrowDown" || k === "s") { pos.r = (pos.r + 1) % h; cb(); return true; }
    if (e.key === "ArrowLeft" || k === "a") { pos.c = (pos.c + w - 1) % w; cb(); return true; }
    if (e.key === "ArrowRight" || k === "d") { pos.c = (pos.c + 1) % w; cb(); return true; }
    return false;
  }
  function endScoreGame(title, score, best, key) {
    if (score > best) { best = score; save(key, best); print("New best score: " + best + "!", "y"); }
    print("GAME OVER - " + title + ". Score: " + score + " | Best: " + best, "r");
    print("Type restart to play again, or quit for the menu.", "dim");
    return best;
  }
  function gameTimer() {
    var id = null;
    return {
      start: function (fn, ms) { clearInterval(id); id = setInterval(fn, ms); },
      stop: function () { clearInterval(id); id = null; }
    };
  }

  // ---------- shell state ----------
  var shell = { mode: "menu", activeGame: null };

  var MENU_ORDER = ["snake", "tetris", "sudoku", "hanoi", "minesweeper", "2048", "hangman", "tictactoe"];
  var TOOL_ORDER = ["cmatrix", "cowsay", "pipes", "lolcat", "sl"];
  var ALIASES = {
    "tower of hanoi": "hanoi", "mines": "minesweeper",
    "tic-tac-toe": "tictactoe", "tic tac toe": "tictactoe", "ttt": "tictactoe",
    "xo": "tictactoe", "noughts": "tictactoe",
    "matrix": "cmatrix", "cow": "cowsay", "rainbow": "lolcat",
    "train": "sl", "steam": "sl", "locomotive": "sl"
  };
  var NAME_TO_ID = {};
  MENU_ORDER.forEach(function (id, i) { NAME_TO_ID[String(i + 1)] = id; NAME_TO_ID[id] = id; });
  TOOL_ORDER.forEach(function (id, i) {
    NAME_TO_ID[String(MENU_ORDER.length + i + 1)] = id;
    NAME_TO_ID[id] = id;
  });
  Object.keys(ALIASES).forEach(function (k) { NAME_TO_ID[k] = ALIASES[k]; });

  function getItem(id) { return GAMES[id] || TOOLS[id]; }
  function padLabel(n) { return ("[" + n + "]").padEnd(4, " "); }

  // ---------- menu / status ----------
  function printCatalog(mode) {
    var i, j, g, t, line;
    if (mode !== "tools") {
      if (mode === "list") print("Games:", "c");
      else { print(""); print("NEONARC", "c"); print(""); print("Choose a game:"); print(""); }
      for (i = 0; i < MENU_ORDER.length; i++) {
        g = GAMES[MENU_ORDER[i]];
        line = padLabel(i + 1) + " " + g.name;
        makeLink(print((mode === "menu" ? line : "  " + line + " - " + g.description), "g"), MENU_ORDER[i]);
      }
      print("");
    }
    if (mode !== "games") {
      print("Linux tools:", "m");
      if (mode === "menu") print("");
      for (j = 0; j < TOOL_ORDER.length; j++) {
        t = TOOLS[TOOL_ORDER[j]];
        line = padLabel(MENU_ORDER.length + j + 1) + " " + t.name;
        makeLink(print((mode === "menu" ? line : "  " + line + " - " + t.description), "p"), TOOL_ORDER[j]);
      }
    }
    if (mode === "menu") {
      print("");
      print("Type a number or a name (or click one), or help.", "dim");
      print("");
    }
  }
  function makeLink(el, id) {
    el.classList.add("link");
    el.setAttribute("role", "button");
    el.tabIndex = 0;
    el.addEventListener("click", function () { submitCommand(id); });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); submitCommand(id); }
    });
  }
  function showMenu() { printCatalog("menu"); }
  function listGames() { printCatalog("list"); }
  function listTools() { printCatalog("tools"); }

  function updateStatus() {
    if (shell.mode === "game" && shell.activeGame) {
      var g = shell.activeGame;
      var label = g.kind === "tool" ? "TOOL" : "GAME";
      var info = typeof g.statusText === "function" ? g.statusText() : "";
      statusEl.innerHTML =
        "MODE: <b>" + label + "</b> | ACTIVE: <b>" + g.name + "</b>" +
        (info ? " | " + info : "") +
        " | COMMANDS: restart, quit";
    } else {
      statusEl.innerHTML = "MODE: <b>MENU</b> | COMMANDS: help, list, tools, play &lt;name&gt;";
    }
  }

  // ---------- mode switching ----------
  function launchGame(id) {
    var g = getItem(id);
    if (!g) { print("Game not found. Type list to see available games.", "r"); return; }
    if (shell.activeGame && shell.activeGame !== g && shell.activeGame.stop) {
      shell.activeGame.stop();
    }
    shell.mode = "game";
    shell.activeGame = g;
    appEl.classList.add("game");
    appEl.classList.remove("logopen");
    terminalEl.style.flexBasis = ""; // back to the default log width on each launch
    fitCols = fitRows = 0;
    buildTouchControls(g);
    clearTerminal();
    print("Launching " + g.name + "...", "c");
    g.start();
    fitScreen(); // again now that the log lines exist (they shrink the board area on mobile)
    updateStatus();
    focusInput();
  }

  function quitToMenu() {
    if (shell.mode !== "game" || !shell.activeGame) {
      print("No active game. You are already in the menu.", "dim");
      return;
    }
    if (shell.activeGame.stop) shell.activeGame.stop();
    shell.activeGame = null;
    shell.mode = "menu";
    appEl.classList.remove("game");
    setScreen("");
    clearTerminal();
    showMenu();
    updateStatus();
    focusInput();
  }

  // ---------- command handling ----------
  var HELP_TEXT = [
    "Available commands:",
    "  help              show this help",
    "  list              show all games and tools",
    "  tools             show the Linux tools",
    "  menu              return to the main menu",
    "  clear             clear the terminal output",
    "  about             about NEONARC",
    "  quit              exit current game/tool, back to menu",
    "  restart           restart the current game/tool",
    "  play <name>       launch a game or tool (e.g. play cmatrix)",
    "",
    "Quick launch: type a number 1-13 or a name.",
    "Controls are shown when a game or tool starts."
  ].join("\n");

  var ABOUT_TEXT = [
    "NEONARC // cyberpunk terminal arcade",
    "A compact neon cyberdeck running eight classic mini-games",
    "plus a handful of retro Linux terminal toys, all inside a",
    "single self-contained terminal. No installs, no clutter.",
    "Type a number or name to jack in.",

  function submitCommand(raw) {
    var original = raw;
    var cmd = raw.trim();
    if (cmd === "") return;

    print("> " + original, "echo");

    var lower = cmd.toLowerCase();
    var parts = lower.split(/\s+/);
    var head = parts[0];

    // ----- global commands (always available) -----
    switch (head) {
      case "help": print(HELP_TEXT); return;
      case "about": print(ABOUT_TEXT, "p"); return;
      case "clear": clearTerminal(); return;
      case "list": listGames(); return;
      case "tools": listTools(); return;
      case "menu": quitToMenu(); return;
      case "quit":
      case "exit": quitToMenu(); return;
      case "restart":
        if (shell.mode === "game" && shell.activeGame) {
          var arg = parts.slice(1).join(" ");
          shell.activeGame.restart(arg);
          updateStatus();
        } else {
          print("No active game to restart. Pick one from the menu.", "dim");
        }
        return;
      case "play":
        var target = lower.slice(4).trim();
        if (!target) { print("Usage: play <name>. Try: play snake or play cmatrix", "y"); return; }
        if (NAME_TO_ID[target]) { launchGame(NAME_TO_ID[target]); }
        else { print("Game not found. Type list to see available games.", "r"); }
        return;
    }

    // ----- launch by number / name (wins over game text, so "snake" in cowsay launches) -----
    if (NAME_TO_ID[lower]) { launchGame(NAME_TO_ID[lower]); return; }

    // ----- in-game custom command (hanoi moves, hangman guesses, cowsay/lolcat text) -----
    if (shell.mode === "game" && shell.activeGame && shell.activeGame.handleCommand) {
      if (shell.activeGame.handleCommand(cmd) === true) { updateStatus(); return; }
    }

    // ----- unknown -----
    print("Unknown command. Type help for available commands.", "r");
  }

  var ARROWS = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
  var GLOBALS = ["help", "about", "clear", "list", "tools", "menu", "quit", "exit", "restart", "play"];
  var SHELL_WORDS = GLOBALS.concat(Object.keys(NAME_TO_ID));
  var NAMES = MENU_ORDER.concat(TOOL_ORDER);

  // A line the shell owns even while a game runs: a global command, or a launch name/number.
  function isShellLine(s) {
    s = s.trim().toLowerCase();
    return GLOBALS.indexOf(s.split(/\s+/)[0]) !== -1 || !!NAME_TO_ID[s];
  }
  function isShellPrefix(s) {
    s = s.toLowerCase();
    return SHELL_WORDS.some(function (w) { return w.indexOf(s) === 0; });

  // AND stays in the prompt for a moment; if the next key continues a command, typing wins.
  // shortcut: plain timeout to tell the two apart; two fast Tic-Tac-Toe moves "1" "2" read as "12".
  var pending = false, pendingTimer = null, PENDING_MS = 700;
  function clearPending() {
    clearTimeout(pendingTimer);
    if (pending) { pending = false; inputEl.value = ""; }
  }

  var history = [], histPos = 0;
  function complete() {
    var m = inputEl.value.match(/^(\s*(?:play\s+)?)(\S*)$/i);
    if (!m) return;
    var word = m[2].toLowerCase();
    var hits = (m[1] ? NAMES : GLOBALS.concat(NAMES)).filter(function (w) { return w.indexOf(word) === 0; });
    if (!hits.length) return;
    var common = hits.reduce(function (a, b) {
      var i = 0;
      while (i < a.length && a[i] === b[i]) i++;
      return a.slice(0, i);
    });
    if (hits.length > 1 && common === word) print(hits.join("  "), "dim");
    inputEl.value = m[1] + common + (hits.length === 1 ? " " : "");
  }

  inputEl.addEventListener("keydown", function (e) {
    var g = shell.activeGame;
    var mod = e.metaKey || e.ctrlKey || e.altKey; // leave browser/OS shortcuts (Cmd+A, Ctrl+R, ...) alone
    var playing = shell.mode === "game" && g && g.handleKey && !mod;

    if (playing && (inputEl.value === "" || pending) && e.key !== "Shift" && e.key !== "CapsLock") {
      if (e.key === "Enter") {

      } else {

        if (g.handleKey(e) === true) {

      complete();
      return;
    }

      clearTimeout(pendingTimer);
      pending = false;

  /* ============================================================
     GAME REGISTRY
     ============================================================ */
  var GAMES = {};

  /* ---------------- SNAKE ---------------- */
  GAMES.snake = (function () {
    var W = 24, H = 15;
    var BEST_KEY = "neonarc.snake.best";
    var TICK = 130;
    var snake, dir, nextDir, food, score, best, over, tick = gameTimer();

    function place() {
      while (true) {
        var f = { x: (Math.random() * W) | 0, y: (Math.random() * H) | 0 };
        var hit = false;
        for (var i = 0; i < snake.length; i++)
          if (snake[i].x === f.x && snake[i].y === f.y) { hit = true; break; }
        if (!hit) return f;
      }
    }
    function reset() {
      snake = [{ x: 8, y: 7 }, { x: 7, y: 7 }, { x: 6, y: 7 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      food = place();
      score = 0;
      over = false;
      best = load(BEST_KEY, 0);
    }
    function step() {
      if (over) return;
      dir = nextDir;
      var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.x >= W || head.y < 0 || head.y >= H) return gameOver();
      for (var i = 0; i < snake.length; i++)
        if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        food = place();
      } else {
        snake.pop();
      }
      render();
      updateStatus();
    }
    function gameOver() {
      over = true;
      tick.stop();
      best = endScoreGame("Snake", score, best, BEST_KEY);
      render();
    }
    var COL = { head: "#00f0ff", body: "#a45bff", food: "#ffd166" };
    function glyph(ch) {
      var col = ch === "@" ? COL.head : ch === "o" ? COL.body : ch === "*" ? COL.food : null;
      return col ? neonSpan(ch, col, 7) : ch;
    }
    function render() {
      var grid = [];
      for (var y = 0; y < H; y++) { grid.push(new Array(W).fill(" ")); }
      grid[food.y][food.x] = "*";
      for (var i = 0; i < snake.length; i++) {
        var s = snake[i];
        if (s.y >= 0 && s.y < H && s.x >= 0 && s.x < W) grid[s.y][s.x] = i === 0 ? "@" : "o";
      }
      var top = "+" + "-".repeat(W) + "+";
      var out = top + "\n";
      for (var r = 0; r < H; r++) {
        var row = "";
        for (var c = 0; c < W; c++) row += glyph(grid[r][c]);
        out += "|" + row + "|\n";
      }
      out += top + "\n";
      out += "\nScore: " + score + "   Best: " + best + "\n";
      out += glyph("@") + " head  " + glyph("o") + " body  " + glyph("*") + " food\n";
      if (over) out += "\n  >> GAME OVER <<\n";
      setScreen(out);
    }
    function begin() { reset(); render(); tick.start(step, TICK); }
    return {
      name: "Snake", description: "Classic neon snake.",
      start: function () {
        begin();
        print("SNAKE // eat the * to grow. Don't hit walls or yourself.", "c");
        print("Controls: Arrow keys / WASD or swipe = move | restart | quit", "dim");
      },
      stop: function () { tick.stop(); },
      restart: function () { tick.stop(); begin(); print("Snake restarted.", "m"); },
      handleKey: function (e) {
        var k = e.key.toLowerCase();
        var nd = null;
        if (e.key === "ArrowUp" || k === "w") nd = { x: 0, y: -1 };
        else if (e.key === "ArrowDown" || k === "s") nd = { x: 0, y: 1 };
        else if (e.key === "ArrowLeft" || k === "a") nd = { x: -1, y: 0 };
        else if (e.key === "ArrowRight" || k === "d") nd = { x: 1, y: 0 };
        if (!nd) return false;
        if (nd.x === -dir.x && nd.y === -dir.y) return true;
        nextDir = nd;
        return true;
      },
      touch: { swipe: "once" },
      statusText: function () { return "SCORE: " + score + " | BEST: " + best; }
    };
  })();

  /* ---------------- TETRIS ---------------- */
  GAMES.tetris = (function () {
    var COLS = 10, ROWS = 18;
    var BEST_KEY = "neonarc.tetris.best";
    var SHAPES = {
      I: [[1, 1, 1, 1]],
      O: [[1, 1], [1, 1]],
      T: [[1, 1, 1], [0, 1, 0]],
      S: [[0, 1, 1], [1, 1, 0]],
      Z: [[1, 1, 0], [0, 1, 1]],
      J: [[1, 0, 0], [1, 1, 1]],
      L: [[0, 0, 1], [1, 1, 1]]
    };
    var KEYS = ["I", "O", "T", "S", "Z", "J", "L"];
    var PIECE_COLORS = {
      I: "#00f0ff", O: "#ffd166", T: "#a45bff", S: "#9dff3d",
      Z: "#ff5470", J: "#6ea8ff", L: "#ff9f45"
    };
    var board, cur, score, lines, level, best, over, tick = gameTimer();

    function rotateCW(m) {
      var rows = m.length, cols = m[0].length;
      var res = [];
      for (var c = 0; c < cols; c++) { res.push(new Array(rows).fill(0)); }
      for (var r = 0; r < rows; r++)
        for (var cc = 0; cc < cols; cc++)
          res[cc][rows - 1 - r] = m[r][cc];
      return res;
    }
    function collide(m, px, py) {
      for (var r = 0; r < m.length; r++)
        for (var c = 0; c < m[r].length; c++) {
          if (!m[r][c]) continue;
          var x = px + c, y = py + r;
          if (x < 0 || x >= COLS || y >= ROWS) return true;
          if (y >= 0 && board[y][x]) return true;
        }
      return false;
    }
    function spawn() {
      var key = KEYS[(Math.random() * KEYS.length) | 0];
      var m = SHAPES[key].map(function (row) { return row.slice(); });
      var px = Math.floor((COLS - m[0].length) / 2);
      cur = { m: m, x: px, y: 0, key: key };
      if (collide(cur.m, cur.x, cur.y)) endGame();
    }
    function lock() {
      for (var r = 0; r < cur.m.length; r++)
        for (var c = 0; c < cur.m[r].length; c++) {
          if (cur.m[r][c]) {
            var y = cur.y + r, x = cur.x + c;
            if (y >= 0) board[y][x] = cur.key;
          }
        }
      clearLines();
      spawn();
    }
    function clearLines() {
      var cleared = 0;
      for (var r = ROWS - 1; r >= 0; r--) {
        var full = board[r].every(function (v) { return v; });
        if (full) {
          board.splice(r, 1);
          board.unshift(new Array(COLS).fill(0));
          cleared++;
          r++;
        }
      }
      if (cleared) {
        var pts = [0, 100, 300, 500, 800][cleared] || 800;
        score += pts * level;
        lines += cleared;
        level = Math.floor(lines / 10) + 1;
        setSpeed();
      }
    }
    function setSpeed() {
      tick.start(tickFn, Math.max(120, 620 - (level - 1) * 60));
    }
    function tickFn() {
      if (over) return;
      if (!collide(cur.m, cur.x, cur.y + 1)) { cur.y++; }
      else { lock(); }
      render();
      updateStatus();
    }
    function endGame() {
      over = true;
      tick.stop();
      best = endScoreGame("Tetris", score, best, BEST_KEY);
      render();
    }
    function reset() {
      board = [];
      for (var r = 0; r < ROWS; r++) board.push(new Array(COLS).fill(0));
      score = 0; lines = 0; level = 1; over = false;
      best = load(BEST_KEY, 0);
      spawn();
    }
    function render() {
      var grid = board.map(function (row) { return row.slice(); });
      if (cur && !over) {
        for (var r = 0; r < cur.m.length; r++)
          for (var c = 0; c < cur.m[r].length; c++)
            if (cur.m[r][c]) {
              var y = cur.y + r, x = cur.x + c;
              if (y >= 0 && y < ROWS && x >= 0 && x < COLS) grid[y][x] = cur.key;
            }
      }
      var top = "+" + "--".repeat(COLS) + "+";
      var out = top + "\n";
      for (var rr = 0; rr < ROWS; rr++) {
        var line = "|";
        for (var cc = 0; cc < COLS; cc++) {
          var v = grid[rr][cc];
          if (v) {
            var col = PIECE_COLORS[v] || "#3dff9a";
            line += neonSpan("[]", col);
          } else {
            line += " .";
          }
        }
        out += line + "|\n";
      }
      out += top + "\n";
      out += "\nScore: " + score + "\nLevel: " + level + "   Lines: " + lines + "\nBest:  " + best + "\n";
      if (over) out += "\n  >> GAME OVER <<\n";
      setScreen(out);
    }
    function begin() { reset(); render(); setSpeed(); }
    return {
      name: "Tetris", description: "Stack and clear neon blocks.",
      start: function () {
        begin();
        print("TETRIS // clear full rows. Don't stack to the top.", "c");
        print("Controls: Left/Right or A/D = move | Down/S = soft drop | Enter = hard drop | Up/W/Space = rotate | restart | quit", "dim");
        print("Touch: swipe = move / soft drop, tap = rotate", "dim");
      },
      stop: function () { tick.stop(); },
      restart: function () { tick.stop(); begin(); print("Tetris restarted.", "m"); },
      handleKey: function (e) {
        if (over) return false;
        var k = e.key.toLowerCase();
        if (e.key === "ArrowLeft" || k === "a") {
          if (!collide(cur.m, cur.x - 1, cur.y)) { cur.x--; render(); } return true;
        }
        if (e.key === "ArrowRight" || k === "d") {
          if (!collide(cur.m, cur.x + 1, cur.y)) { cur.x++; render(); } return true;
        }
        if (e.key === "ArrowDown" || k === "s") {
          if (!collide(cur.m, cur.x, cur.y + 1)) { cur.y++; } else { lock(); }
          render(); return true;
        }
        if (e.key === "Enter") {

      statusText: function () { return "SCORE: " + score + " | LVL: " + level + " | BEST: " + best; }
    };
  })();

  /* ---------------- SUDOKU ---------------- */
  GAMES.sudoku = (function () {

      0, 9, 8, 0, 0, 0, 0, 6, 0,

    ];

    function reset() {

        mine[idx(r, c)] = true; placed++;

        for (var ccc = 0; ccc < SIZE; ccc++) {

            for (var dc = -1; dc <= 1; dc++)

    }
    function slide(arr) {
      var a = arr.filter(function (v) { return v !== 0; });
      var gained = 0;
      for (var i = 0; i < a.length - 1; i++) {
        if (a[i] === a[i + 1]) {
          a[i] *= 2; gained += a[i];

        if (dir === "left" || dir === "right") line.push(grid[k * N + i]);

      if (over) { print("Round over. Type restart for a new round or quit.", "dim"); return; }
      if (board[i]) { print("Square " + (i + 1) + " is already taken.", "y"); return; }
      board[i] = current;
      var line = checkWin();
      if (line) {
        over = true; winner = current; winLine = line; scores[current]++;
        render();
        print("Player " + current + " wins! (X " + scores.X + " - O " + scores.O + ", draws " + scores.draws + ")", "y");
      } else if (board.every(function (v) { return v; })) {
        over = true; winner = "draw"; scores.draws++;
        render();
        print("It's a draw. (X " + scores.X + " - O " + scores.O + ", draws " + scores.draws + ")", "m");
      } else {
        current = current === "X" ? "O" : "X";
        render();
      }
    }
    function cellStr(i) {
      var v = board[i];
      var inWin = winLine && winLine.indexOf(i) !== -1;
      var glyph;
      if (v) glyph = neonSpan(v, inWin ? COL.win : COL[v], 7);
      else glyph = neonSpan(String(i + 1), COL.dim, 7);
      if (i === cursor && !over) return "[" + glyph + "]";
      return " " + glyph + " ";
    }
    function render() {
      var out = "";
      for (var r = 0; r < 3; r++) {
        out += cellStr(r * 3) + "|" + cellStr(r * 3 + 1) + "|" + cellStr(r * 3 + 2) + "\n";
        if (r < 2) out += "---+---+---\n";
      }
      out += "\n";
      if (over) {
        out += winner === "draw" ? "  Draw game.\n" : "  Player " + neonSpan(winner, COL[winner], 7) + " wins!\n";
      } else {
        out += "  Turn: " + neonSpan(current, COL[current], 7) + "\n";
      }
      out += "\nScore   " + neonSpan("X", COL.X, 7) + " " + scores.X +
             "   " + neonSpan("O", COL.O, 7) + " " + scores.O + "   draws " + scores.draws + "\n";
      setScreen(out);
    }
    return {
      name: "Tic-Tac-Toe", description: "Two-player X and O.",
      start: function () {
        scores = { X: 0, O: 0, draws: 0 };
        reset(); render();
        print("TIC-TAC-TOE // two players, X and O take turns.", "c");
        print("Controls: Arrows/WASD = move | 1-9 = place | Enter/Space or tap = place | restart | quit", "dim");
      },
      restart: function () { reset(); render(); print("New round. Player X starts.", "m"); },
      handleKey: function (e) {
        var k = e.key.toLowerCase();
        if (e.key === "ArrowUp" || k === "w") { cursor = (cursor + 6) % 9; render(); return true; }
        if (e.key === "ArrowDown" || k === "s") { cursor = (cursor + 3) % 9; render(); return true; }
        if (e.key === "ArrowLeft" || k === "a") { cursor = (cursor % 3 === 0 ? cursor + 2 : cursor - 1); render(); return true; }
        if (e.key === "ArrowRight" || k === "d") { cursor = (cursor % 3 === 2 ? cursor - 2 : cursor + 1); render(); return true; }
        if (e.key === "Enter" || e.key === " " || k === "spacebar") { place(cursor); updateStatus(); return true; }
        if (/^[1-9]$/.test(e.key)) { cursor = Number(e.key) - 1; place(cursor); updateStatus(); return true; }
        return false;
      },
      cellAt: function (line, col) { return line < 5 && col < 11 ? { r: Math.floor(line / 2), c: Math.floor(col / 4) } : null; },
      cursorAt: function () { return { r: (cursor / 3) | 0, c: cursor % 3 }; },
      touch: { tap: "Enter" },
      statusText: function () {
        if (over) return winner === "draw" ? "DRAW | X " + scores.X + " O " + scores.O
          : "WINNER: " + winner + " | X " + scores.X + " O " + scores.O;
        return "TURN: " + current + " | X " + scores.X + " O " + scores.O;
      }
    };
  })();

  /* ============================================================
     TOOLS REGISTRY (retro Linux terminal toys)
     ============================================================ */
  var TOOLS = {};

  /* ---------------- CMATRIX ---------------- */
  TOOLS.cmatrix = (function () {
    var W = 34, H = 20, TRAIL = 9, MS = 90;
    var CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+=<>";
    var chars, drops, tick = gameTimer();
    function rnd() { return CHARS[(Math.random() * CHARS.length) | 0]; }
    function reset() {
      chars = []; drops = [];
      for (var y = 0; y < H; y++) { chars.push([]); for (var x = 0; x < W; x++) chars[y].push(rnd()); }
      for (var c = 0; c < W; c++) drops[c] = -((Math.random() * H * 2) | 0);
    }
    function shade(k) {
      if (k === 0) return "#eafff2";
      if (k === 1) return "#9dffcf";
      if (k <= 3) return "#3dff9a";
      if (k <= 5) return "#22b56b";
      return "#0d6b3f";
    }
    function render() {
      var grid = [];
      for (var y = 0; y < H; y++) grid.push(new Array(W).fill(" "));
      for (var c = 0; c < W; c++) {
        var head = drops[c];
        for (var k = 0; k < TRAIL; k++) {
          var yy = head - k;
          if (yy >= 0 && yy < H) grid[yy][c] = neonSpan(chars[yy][c], shade(k));
        }
      }
      var out = "";
      for (var r = 0; r < H; r++) out += grid[r].join("") + "\n";
      setScreen(out);
    }
    function step() {
      for (var i = 0; i < 6; i++) {
        var ry = (Math.random() * H) | 0, rx = (Math.random() * W) | 0;
        chars[ry][rx] = rnd();
      }
      for (var c = 0; c < W; c++) {
        drops[c]++;
        if (drops[c] - TRAIL > H && Math.random() < 0.06) drops[c] = -((Math.random() * H) | 0);
      }
      render();
    }
    function begin() { reset(); render(); tick.start(step, MS); }
    return {
      name: "cmatrix", description: "Falling neon code rain.", kind: "tool",
      start: function () {
        begin();
        print("cmatrix // the neon rain falls. There is no spoon.", "c");
        print("Controls: just watch | restart | quit", "dim");
      },
      stop: function () { tick.stop(); },
      restart: function () { tick.stop(); begin(); print("cmatrix restarted.", "m"); }
    };
  })();

  /* ---------------- COWSAY ---------------- */
  TOOLS.cowsay = (function () {
    var message;
    var COW = [
      "        \\   ^__^",
      "         \\  (oo)\\_______",
      "            (__)\\       )\\/\\",
      "                ||----w |",
      "                ||     ||"
    ];
    function wrap(text, width) {
      var words = text.split(/\s+/), lines = [], cur = "";
      for (var i = 0; i < words.length; i++) {
        var w = words[i];
        if (cur === "") cur = w;
        else if ((cur + " " + w).length <= width) cur += " " + w;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      return lines.length ? lines : [""];
    }
    function render() {
      var lines = wrap(message, 38);
      var maxLen = 0;
      for (var i = 0; i < lines.length; i++) maxLen = Math.max(maxLen, lines[i].length);
      var top = " " + "_".repeat(maxLen + 2);
      var bottom = " " + "-".repeat(maxLen + 2);
      var bubble = top + "\n";
      for (var j = 0; j < lines.length; j++) {
        var l, r;
        if (lines.length === 1) { l = "<"; r = ">"; }
        else if (j === 0) { l = "/"; r = "\\"; }
        else if (j === lines.length - 1) { l = "\\"; r = "/"; }
        else { l = "|"; r = "|"; }
        var padded = lines[j] + " ".repeat(maxLen - lines[j].length);
        var msgSpan = neonSpan(escHTML(padded), "#00f0ff");
        bubble += l + " " + msgSpan + " " + r + "\n";
      }
      bubble += bottom + "\n";
      setScreen(bubble + neonSpan(escHTML(COW.join("\n")), "#ff2bd6") + "\n");
    }
    return {
      name: "cowsay", description: "A neon cow says your words.", kind: "tool",
      start: function () {
        message = "Welcome to NEONARC. Type anything and I will say it.";
        render();
        print("cowsay // type any text and press Enter to make the cow speak.", "c");
        print("Controls: type text = say it | restart | quit", "dim");
      },
      restart: function () { message = "Moo. Ready for a new message."; render(); print("cowsay reset.", "m"); },
      handleCommand: function (cmd) {
        if (!cmd) return false;
        message = cmd;
        render();
        return true;
      }
    };
  })();

  /* ---------------- PIPES ---------------- */
  TOOLS.pipes = (function () {
    var W = 34, H = 20, MS = 70;
    var COLORS = ["#00f0ff", "#ff2bd6", "#a45bff", "#3dff9a", "#ffd166", "#ff5470", "#6ea8ff"];
    var ch, colr, x, y, dir, color, filled, tick = gameTimer();
    var TURN = {
      "0,1": "\u250c", "0,3": "\u2510", "2,1": "\u2514", "2,3": "\u2518",
      "1,0": "\u2518", "1,2": "\u2510", "3,0": "\u2514", "3,2": "\u250c"
    };
    function reset() {
      ch = []; colr = [];
      for (var r = 0; r < H; r++) { ch.push(new Array(W).fill(" ")); colr.push(new Array(W).fill(null)); }
      x = (W / 2) | 0; y = (H / 2) | 0; dir = (Math.random() * 4) | 0;
      color = COLORS[(Math.random() * COLORS.length) | 0]; filled = 0;
    }
    function put(char) {
      if (ch[y][x] === " ") filled++;
      ch[y][x] = char; colr[y][x] = color;
    }
    function step() {
      var newDir = dir;
      if (Math.random() < 0.12) newDir = (dir + (Math.random() < 0.5 ? 1 : 3)) % 4;
      if (newDir === dir) put(dir === 0 || dir === 2 ? "\u2502" : "\u2500");
      else put(TURN[dir + "," + newDir]);
      dir = newDir;
      if (dir === 0) y--; else if (dir === 1) x++; else if (dir === 2) y++; else x--;
      if (x < 0 || x >= W || y < 0 || y >= H) {
        x = (x + W) % W; y = (y + H) % H;
        color = COLORS[(Math.random() * COLORS.length) | 0];
      }
      if (filled > W * H * 0.7) reset();
    }
    function render() {
      var out = "";
      for (var r = 0; r < H; r++) {
        var line = "";
        for (var c = 0; c < W; c++) {
          line += ch[r][c] === " " ? " " : neonSpan(ch[r][c], colr[r][c]);
        }
        out += line + "\n";
      }
      setScreen(out);
    }
    function run() { step(); render(); }
    function begin() { reset(); render(); tick.start(run, MS); }
    return {
      name: "pipes", description: "Neon pipes screensaver.", kind: "tool",
      start: function () {
        begin();
        print("pipes // neon conduits snaking across the deck.", "c");
        print("Controls: just watch | restart | quit", "dim");
      },
      stop: function () { tick.stop(); },
      restart: function () { tick.stop(); begin(); print("pipes restarted.", "m"); }
    };
  })();

  /* ---------------- LOLCAT ---------------- */
  TOOLS.lolcat = (function () {
    var text, offset, tick = gameTimer(), MS = 110;
    var DEFAULT = ["NEONARC", "rainbow terminal filter", "type any text to colorize it"];
    function render() {
      var lines = Array.isArray(text) ? text : String(text).split("\n");
      var out = "";
      var i = 0;
      for (var li = 0; li < lines.length; li++) {
        var line = lines[li];
        for (var c = 0; c < line.length; c++) {
          var chr = line[c];
          if (chr === " ") { out += " "; i++; continue; }
          var hue = (i * 12 + offset) % 360;
          var col = "hsl(" + hue + ",100%,65%)";
          out += neonSpan(escHTML(chr), col);
          i++;
        }
        out += "\n";
        i += 6;
      }
      setScreen(out);
    }
    function step() { offset = (offset + 12) % 360; render(); }
    // reduced motion: keep the rainbow, drop the colour cycling
    function begin() {
      text = DEFAULT; offset = 0; render();
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) tick.start(step, MS);
    }
    return {
      name: "lolcat", description: "Rainbow-colored text.", kind: "tool",
      start: function () {
        begin();
        print("lolcat // everything is better in rainbow.", "c");
        print("Controls: type text = colorize it | restart | quit", "dim");
      },
      stop: function () { tick.stop(); },
      restart: function () { tick.stop(); begin(); print("lolcat reset.", "m"); },
      handleCommand: function (cmd) {
        if (!cmd) return false;
        text = [cmd]; render();
        return true;
      }
    };
  })();

  /* ---------------- SL (steam locomotive) ---------------- */
  TOOLS.sl = (function () {
    var W = 46, MS = 90;
    var TRAIN = [
      "      ====        ____",
      "  ___|[]|_______|    |___",
      " |___________________|__|]",
      " |   NEONARC  o   o     ||",
      " |_____________________ ||",
      "   (O)==(O)     (O)==(O) "
    ];
    var TW = 0, offset, gone, tick = gameTimer();
    for (var t = 0; t < TRAIN.length; t++) TW = Math.max(TW, TRAIN[t].length);
    function render() {
      var out = "";
      for (var r = 0; r < TRAIN.length; r++) {
        var buf = new Array(W).fill(" ");
        var line = TRAIN[r];
        for (var i = 0; i < line.length; i++) {
          var col = offset + i;
          if (col >= 0 && col < W) buf[col] = line[i];
        }
        out += neonSpan(escHTML(buf.join("")), "#ffd166") + "\n";
      }
      out += "\n";
      if (gone) {
        var msg = ["The train has departed.", "Type restart to run it again."];
        for (var m = 0; m < msg.length; m++) out += center(msg[m], W) + "\n";
      }
      setScreen(out);
    }
    function step() {
      offset -= 1;
      if (offset < -TW) { gone = true; tick.stop(); }
      render();
    }
    function begin() { offset = W; gone = false; render(); tick.start(step, MS); }
    return {
      name: "sl", description: "A steam locomotive rolls by.", kind: "tool",
      start: function () {
        begin();
        print("sl // steam locomotive incoming. All aboard!", "c");
        print("Controls: watch it roll | restart | quit", "dim");
      },
      stop: function () { tick.stop(); },
      restart: function () { tick.stop(); begin(); print("sl restarted.", "m"); }
    };
  })();

  /* ============================================================
     BOOT SEQUENCE
     ============================================================ */
  var BOOT_LINES = [
    { t: "Initializing Neonarc...", c: "c" },
    { t: "Loading terminal shell...", c: "p" },
    { t: "Calibrating neon grid...", c: "m" },
    { t: "Cyberdeck online.", c: "g" }
  ];

  function boot() {
    updateStatus();
    var i = 0, timer = null;
    function next() {
      if (i < BOOT_LINES.length) {
        print(BOOT_LINES[i].t, BOOT_LINES[i].c);
        i++;
        timer = setTimeout(next, 420);
      } else {
        document.removeEventListener("keydown", skip, true);
        document.removeEventListener("pointerdown", skip, true);
        showMenu();
        focusInput();
      }
    }
    // any key or tap skips the rest of the boot lines
    function skip(e) {
      if (e.type === "keydown") {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        e.preventDefault();
        e.stopPropagation();
      }
      clearTimeout(timer);
      for (; i < BOOT_LINES.length; i++) print(BOOT_LINES[i].t, BOOT_LINES[i].c);
      next();
    }
    document.addEventListener("keydown", skip, true);
    document.addEventListener("pointerdown", skip, true);
    next();
  }

  // GAMES is fully populated above; safe to boot now.
  focusInput();
  boot();
})();
</script>
